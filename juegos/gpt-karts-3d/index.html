<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GPT Karts 3D</title><style>body{margin:0;background:#101827;color:white;font-family:system-ui;overflow:hidden}#hud{position:absolute;top:12px;left:12px;background:#101827c9;padding:12px;border-radius:12px;z-index:2}#help{position:absolute;bottom:12px;left:12px;background:#101827c9;padding:10px;border-radius:10px}button{background:#22c55e;border:0;border-radius:8px;padding:10px;color:#07140c;font-weight:bold;cursor:pointer}#mobile{position:absolute;bottom:15px;right:15px;display:flex;gap:8px}#mobile button{font-size:22px;min-width:54px;touch-action:none}canvas{display:block}</style></head><body><div id="hud"><b>🏁 GPT KARTS 3D</b><div id="score">Tú: vuelta 0/3 · GPT: vuelta 0/3</div><div id="speed">Velocidad: 0</div><div id="msg">¡Adelanta al GPT!</div><button onclick="restart()">Reiniciar</button></div><div id="help">W/↑ acelerar · S/↓ frenar · A/D girar · Espacio turbo</div><div id="mobile"><button data-k="ArrowLeft">◀</button><button data-k="ArrowUp">▲</button><button data-k="ArrowRight">▶</button><button data-k="Space">⚡</button></div><script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script><script>
const scene=new THREE.Scene();scene.background=new THREE.Color(0x8ac8f7);scene.fog=new THREE.Fog(0x8ac8f7,110,240);const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.1,500);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;document.body.appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(0xffffff,0x527644,2));const sun=new THREE.DirectionalLight(0xffffff,2);sun.position.set(30,65,20);scene.add(sun);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(500,500),new THREE.MeshLambertMaterial({color:0x4c9d53}));ground.rotation.x=-Math.PI/2;scene.add(ground);
const a=49,b=32,width=13;function ring(r1,r2,color,y){let shape=new THREE.Shape();shape.absellipse(0,0,r1,r2,0,Math.PI*2,false,0);let hole=new THREE.Path();hole.absellipse(0,0,r1-width,r2-width,0,Math.PI*2,true,0);shape.holes.push(hole);let mesh=new THREE.Mesh(new THREE.ShapeGeometry(shape,96),new THREE.MeshLambertMaterial({color,side:THREE.DoubleSide}));mesh.rotation.x=-Math.PI/2;mesh.position.y=y;scene.add(mesh)}ring(a+width/2,b+width/2,0x333740,.04);
for(let i=0;i<90;i++){let t=i*Math.PI*2/90;let m=new THREE.Mesh(new THREE.BoxGeometry(1.6,.07,.38),new THREE.MeshBasicMaterial({color:0xf7eaa4}));m.position.set(a*Math.cos(t),.12,b*Math.sin(t));m.rotation.y=-Math.atan2(b*Math.cos(t),-a*Math.sin(t));scene.add(m)}
for(let j=0;j<2;j++)for(let i=0;i<96;i++){let t=i*Math.PI*2/96;let r=j?1:-1;let x=(a+r*width/2)*Math.cos(t),z=(b+r*width/2)*Math.sin(t);let block=new THREE.Mesh(new THREE.BoxGeometry(3,.7,1.3),new THREE.MeshLambertMaterial({color:i%2?0xffffff:0xe53935}));block.position.set(x,.35,z);block.rotation.y=-Math.atan2(b*Math.cos(t),-a*Math.sin(t));scene.add(block)}
for(let i=0;i<70;i++){let x=(Math.random()-.5)*220,z=(Math.random()-.5)*180;if(Math.abs(x)<65&&Math.abs(z)<49)continue;let trunk=new THREE.Mesh(new THREE.CylinderGeometry(.45,.65,3),new THREE.MeshLambertMaterial({color:0x80532d}));trunk.position.set(x,1.5,z);scene.add(trunk);let crown=new THREE.Mesh(new THREE.ConeGeometry(3,8,7),new THREE.MeshLambertMaterial({color:0x176c39}));crown.position.set(x,7,z);scene.add(crown)}
function kart(color){let g=new THREE.Group();let body=new THREE.Mesh(new THREE.BoxGeometry(2.8,.75,4.1),new THREE.MeshLambertMaterial({color}));body.position.y=.75;g.add(body);let nose=new THREE.Mesh(new THREE.BoxGeometry(2.4,.3,1.2),new THREE.MeshLambertMaterial({color:0xfacc15}));nose.position.set(0,.55,-2);g.add(nose);for(let x of [-1.5,1.5])for(let z of [-1.35,1.35]){let w=new THREE.Mesh(new THREE.CylinderGeometry(.6,.6,.42,12),new THREE.MeshLambertMaterial({color:0x171717}));w.rotation.z=Math.PI/2;w.position.set(x,.6,z);g.add(w)}let head=new THREE.Mesh(new THREE.SphereGeometry(.55,16,12),new THREE.MeshLambertMaterial({color:0xffd0a0}));head.position.set(0,1.8,.4);g.add(head);let helmet=new THREE.Mesh(new THREE.SphereGeometry(.59,16,12,0,Math.PI*2,0,Math.PI/2),new THREE.MeshLambertMaterial({color}));helmet.position.copy(head.position);g.add(helmet);scene.add(g);return g}
const player=kart(0x1d75ff),bot=kart(0xff3758);let theta=0,bt=-.18,velocity=0,laps=0,blaps=0,finished=false;const keys={};onkeydown=e=>{keys[e.code]=true;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault()};onkeyup=e=>keys[e.code]=false;document.querySelectorAll('[data-k]').forEach(el=>{let k=el.dataset.k;el.onpointerdown=e=>{e.preventDefault();keys[k]=true;el.setPointerCapture(e.pointerId)};el.onpointerup=el.onpointercancel=()=>keys[k]=false});function pos(t,r=0){return new THREE.Vector3((a+r)*Math.cos(t),.1,(b+r)*Math.sin(t))}function orient(g,t){let dx=-a*Math.sin(t),dz=b*Math.cos(t);g.rotation.y=Math.atan2(-dx,-dz)}function restart(){theta=0;bt=-.18;velocity=0;laps=blaps=0;finished=false;document.getElementById('msg').textContent='¡Adelanta al GPT!'}
let last=performance.now();function loop(now){requestAnimationFrame(loop);let dt=Math.min((now-last)/1000,.05);last=now;if(!finished){let accelerating=keys.KeyW||keys.ArrowUp,braking=keys.KeyS||keys.ArrowDown;velocity+=(accelerating?17:braking?-27:-8)*dt;velocity=Math.max(0,Math.min(keys.Space?42:29,velocity));let turn=(keys.KeyA||keys.ArrowLeft?-1:0)+(keys.KeyD||keys.ArrowRight?1:0);theta+=velocity*dt/40*(1-turn*.36);bt+=dt*(.53+.045*Math.sin(now/1400));if(theta/(Math.PI*2)>=laps+1)laps++;if(bt/(Math.PI*2)>=blaps+1)blaps++;if(laps>=3||blaps>=3){finished=true;document.getElementById('msg').textContent=laps>=3?'🏆 ¡HAS GANADO AL GPT!':'🤖 GPT HA GANADO. ¡REVANCHA!'}}let p=pos(theta,Math.sin(theta*2)*1.3),q=pos(bt,2.5);player.position.copy(p);bot.position.copy(q);orient(player,theta);orient(bot,bt);let chase=new THREE.Vector3(p.x+13*Math.cos(theta-.4),10,p.z+13*Math.sin(theta-.4));camera.position.lerp(chase,.09);camera.lookAt(p.x,p.y+1,p.z);document.getElementById('score').textContent=`Tú: vuelta ${Math.min(laps,3)}/3 · GPT: vuelta ${Math.min(blaps,3)}/3`;document.getElementById('speed').textContent=`Velocidad: ${Math.round(velocity*5)} km/h`;renderer.render(scene,camera)}requestAnimationFrame(loop);onresize=()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)};
</script></body></html>
